<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Grok Bot · Memecoin Trade (live)</title>
<style>
:root{--g:#16a34a;--g2:#22c55e;--r:#ef4444;--ink:#0f172a;--mut:#64748b;--line:#e8edf2;--bg:#f6f8fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e9edf1;overflow:hidden}
body{font-family:"Inter","Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:540px;height:960px;transform-origin:0 0;background:var(--bg);overflow:hidden;border-radius:0}
body.framed #stage{border-radius:34px;box-shadow:0 30px 80px rgba(15,23,42,.18)}
.mono{font-family:"JetBrains Mono","IBM Plex Mono",monospace}
/* status bar */
#sb{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-weight:700;font-size:15px}
#sb .r{display:flex;gap:8px;align-items:center}
#mode{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:20px;background:#fee2e2;color:#dc2626;display:flex;align-items:center;gap:5px}
#mode i{width:6px;height:6px;border-radius:50%;background:#dc2626;display:block;animation:blink 1.2s infinite}
#mode.rep{background:#e0e7ff;color:#4f46e5}#mode.rep i{background:#4f46e5}
@keyframes blink{50%{opacity:.25}}
/* header */
#hd{position:absolute;top:42px;left:22px;right:22px;height:40px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
#hd b{font-size:17px;letter-spacing:-.01em}#hd small{display:block;color:var(--mut);font-size:11.5px;font-weight:500;margin-top:1px}
#wdot{margin-left:auto;font-size:11px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:20px}
#wdot i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px #dcfce7}
/* balance card */
#card{position:absolute;top:90px;left:16px;right:16px;height:178px;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(15,23,42,.05)}
.lbl{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.lbl .gk{width:16px;height:16px;border-radius:5px;background:#0f172a;color:#fff;font-size:9px;font-weight:900;display:grid;place-items:center}
#bal{font-size:50px;font-weight:800;letter-spacing:-.035em;color:var(--g);margin-top:4px;line-height:1.05;font-variant-numeric:tabular-nums}
#bal span{font-size:22px;letter-spacing:0;margin-left:6px;color:#15803d;font-weight:700}
#usd{position:absolute;right:18px;top:16px;font-size:12px;color:var(--mut);font-weight:600}
#row{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:800}
.pg{background:#dcfce7;color:#15803d}.pr{background:#fee2e2;color:#dc2626}.pn{background:#f1f5f9;color:#334155}
#bar{position:absolute;left:18px;right:18px;bottom:30px;height:8px;border-radius:8px;background:#eef2f6;overflow:visible}
#fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#86efac,#16a34a);width:0%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
#mark{position:absolute;top:-4px;width:2px;height:16px;background:#0f172a;border-radius:2px;opacity:.5}
#barl{position:absolute;left:18px;right:18px;bottom:10px;font-size:10.5px;color:var(--mut);display:flex;justify-content:space-between;font-weight:600}
/* map */
#mapw{position:absolute;top:278px;left:16px;right:16px;height:340px;border-radius:22px;overflow:hidden;background:#eef5ee;box-shadow:inset 0 0 0 1px #e2ebe3}
#map{width:100%;height:100%;display:block}
#maptag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;color:#3f6b4b;background:rgba(255,255,255,.85);padding:4px 9px;border-radius:20px;backdrop-filter:blur(4px)}
#legend{position:absolute;right:10px;top:10px;display:flex;gap:4px}
/* tabs */
#tabs{position:absolute;top:628px;left:16px;right:16px;height:38px;background:#eef1f4;border-radius:14px;display:flex;padding:4px}
#tabs div{flex:1;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mut);border-radius:10px;cursor:pointer;transition:.2s}
#tabs div.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#panel{position:absolute;top:674px;left:16px;right:16px;bottom:14px;overflow:hidden}
.ag{height:52px;margin-bottom:5px;background:#fff;border-radius:16px;display:flex;align-items:center;padding:0 12px;gap:11px;box-shadow:0 1px 0 var(--line)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.15)}
.ag .t{flex:1;min-width:0}
.ag .n{font-size:13.5px;font-weight:700}
.ag .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px;margin-top:1px;transition:color .3s}
.ag .s.fl{animation:sw .45s ease}
@keyframes sw{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.ag .st{text-align:right;font-variant-numeric:tabular-nums}.ag .st b{font-size:15px;display:block}.ag .st small{font-size:10px;color:var(--mut);font-weight:600}
.tr{display:flex;align-items:center;height:36px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;padding:0 6px;background:#fff}
.tr:first-child{border-radius:14px 14px 0 0}.tr .sy{flex:1}.tr span{width:80px;text-align:right;font-variant-numeric:tabular-nums}
/* notification */
#nt{position:absolute;left:14px;right:14px;top:8px;height:58px;border-radius:20px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(15,23,42,.16),0 0 0 1px rgba(15,23,42,.04);display:flex;align-items:center;gap:11px;padding:0 14px;transform:translateY(-110px);transition:transform .55s cubic-bezier(.2,1.25,.3,1);z-index:10}
#nt.show{transform:translateY(0)}
#nt .ic{width:34px;height:34px;border-radius:10px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
#nt .a{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.02em}
#nt .m{font-size:14.5px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#nt .v{margin-left:auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div id="sb"><span id="clk" class="mono">--:--</span><div class="r"><span id="mode" class="rep"><i></i><b id="modet">REPLAY</b></span>
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0f172a"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#0f172a"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#0f172a"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0f172a"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#0f172a" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#0f172a"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#0f172a" opacity=".4"/></svg></div></div>
  <div id="nt"><div class="ic">G</div><div><div class="a">GROK BOT · <span id="nta">NOW</span></div><div class="m" id="ntm"></div></div><div class="v" id="ntv"></div></div>
  <div id="hd"><div class="logo">G</div><div><b>Memecoin Trade</b><small>Solana · Phantom agent wallet · 0.2 SOL per trade</small></div><div id="wdot"><i></i><span id="wtxt">Watcher on</span></div></div>
  <div id="card">
    <div class="lbl"><span class="gk">G</span>Grok Bot · Wallet balance</div>
    <div id="usd"></div>
    <div id="bal"><b id="baln">1.0000</b><span>SOL</span></div>
    <div id="row"><span id="pnl">Realized +0.0000 SOL</span><span id="pct" class="pill pn">0.0%</span><span id="mult" class="pill pn">1.00×</span><span id="wl" class="pill pn" style="margin-left:auto">0W · 0L</span></div>
    <div id="bar"><div id="fill"></div><div id="mark"></div></div>
    <div id="barl"><span>0</span><span id="startl">start 1.000 SOL</span><span>1.5</span></div>
  </div>
  <div id="mapw"><canvas id="map"></canvas><div id="maptag">Pipeline map · real bot events</div></div>
  <div id="tabs"><div class="on" data-t="ag">Agents</div><div data-t="tk">Tokens</div><div data-t="me">Me</div></div>
  <div id="panel"></div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const W=540,H=960,MW=508,MH=340;
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;stage.style.transformOrigin='center';stage.style.left='50%';stage.style.top='50%';document.body.classList.toggle('framed',innerWidth>W*s+40);return s}
let SCALE=fit();
const cv=document.getElementById('map'),cx=cv.getContext('2d');
function sizeCanvas(){const k=Math.max(1,SCALE*(devicePixelRatio||1));cv.width=MW*k;cv.height=MH*k;cx.setTransform(k,0,0,k,0,0);bgCache=null}
addEventListener('resize',()=>{SCALE=fit();sizeCanvas()});
let bgCache=null;
// ---------- helpers
const $=id=>document.getElementById(id);
const fmt=(v,d=4)=>(v>=0?'+':'−')+Math.abs(v).toFixed(d);
const wib=ts=>{const d=new Date(ts);d.setUTCHours(d.getUTCHours()+7);return d.toISOString().slice(11,16)};
const nowWib=()=>{const d=new Date();d.setUTCHours(d.getUTCHours()+7);return d.toISOString().slice(11,16)};
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// ---------- agents
const AG=[
 {k:'scan',n:'Scanner',ic:'S',c:'#3b82f6',home:[70,318]},
 {k:'bundle',n:'Bundle Check',ic:'B',c:'#f59e0b',home:[165,320]},
 {k:'safety',n:'RugCheck & Filters',ic:'R',c:'#8b5cf6',home:[255,321]},
 {k:'buy',n:'Buyer',ic:'$',c:'#10b981',home:[345,320]},
 {k:'sell',n:'Watcher / Seller',ic:'W',c:'#ec4899',home:[438,318]},
];
const A={};AG.forEach((a,i)=>{A[a.k]=Object.assign(a,{x:a.home[0],y:a.home[1],from:null,to:null,t0:0,dur:1,trail:[],status:'idle',stat:'0',sl:'',ph:i*1.3})});
function go(k,x,y,dur,delay=0){const a=A[k];a.from=[a.x,a.y];a.to=[x,y];a.t0=performance.now()+delay;a.dur=dur;const dx=x-a.x,dy=y-a.y;const s=(hash(k+x+y)%2?1:-1)*0.28;a.cp=[(a.x+x)/2-dy*s,(a.y+y)/2+dx*s]}
// ---------- nodes
const SLOTS=[];{const r=rng(42);for(let row=0;row<4;row++)for(let col=0;col<5;col++)SLOTS.push([50+col*96+(row%2?22:-6)+(r()-.5)*14,82+row*60+(r()-.5)*8])}
const nodes={};const used=new Set();
function slotFor(sym){let i=hash(sym)%SLOTS.length;for(let j=0;j<SLOTS.length;j++){const s=(i+j*7)%SLOTS.length;if(!used.has(s)){used.add(s);return s}}
  // evict oldest faded skip
  let old=null;for(const k in nodes){const n=nodes[k];if(n.kind==='skip'&&(!old||n.t<old.t))old=n}
  if(old){delete nodes[old.sym];return old.slot}return 0}
function node(sym,kind){let n=nodes[sym];if(!n){const slot=slotFor(sym);n=nodes[sym]={sym,slot,x:SLOTS[slot][0],y:SLOTS[slot][1],kind,t:performance.now(),badge:'',bc:'#94a3b8',born:performance.now()}}
  n.kind=kind;n.t=performance.now();return n}
function freeSkips(){const now=performance.now();for(const k in nodes){const n=nodes[k];if(n.kind==='skip'&&now-n.t>(LIVE?20000:5200)){used.delete(n.slot);delete nodes[k]}}}
const floats=[];
function floatPill(x,y,txt,col,bg){floats.push({x,y,txt,col,bg,t:performance.now()})}
// ---------- UI state
let shownBal=null,targetBal=null,balFrom=0,balT0=0;
let D=null;let LIVE=false;const seen=new Set();const queue=[];
let st={evaluated:new Set(),bundle:0,safety:0,buys:0,spent:0,w:0,l:0,realized:0,trades:[]};
function setBal(v){if(shownBal===null){shownBal=v;targetBal=v;return}balFrom=shownBal;targetBal=v;balT0=performance.now()}
function renderCard(){const start=D?.start_sol||1;const b=shownBal??start;
  $('baln').textContent=b.toFixed(4);
  const usd=D?.sol_usd?b*D.sol_usd:null;$('usd').textContent=usd?`≈ $${usd.toFixed(2)}`:'';
  const r=st.realized;$('pnl').textContent=`Realized ${fmt(r)} SOL`;$('pnl').style.color=r>=0?'#15803d':'#dc2626';
  const vs=(b/start-1)*100;const p=$('pct');p.textContent=`${vs>=0?'+':'−'}${Math.abs(vs).toFixed(1)}% vs start`;p.className='pill '+(vs>=0?'pg':'pr');
  const m=$('mult');m.textContent=`${(b/start).toFixed(2)}×`;m.className='pill '+(b>=start?'pg':'pn');
  $('wl').textContent=`${st.w}W · ${st.l}L`;
  $('fill').style.width=Math.min(100,b/1.5*100)+'%';$('mark').style.left=(start/1.5*100)+'%';$('startl').textContent=`start ${start.toFixed(3)} SOL`}
// ---------- panel
let tab='ag';
document.querySelectorAll('#tabs div').forEach(d=>d.onclick=()=>{tab=d.dataset.t;document.querySelectorAll('#tabs div').forEach(x=>x.classList.toggle('on',x===d));buildPanel()});
function buildPanel(){const p=$('panel');
 if(tab==='ag'){p.innerHTML=AG.map(a=>`<div class="ag"><div class="av" style="background:${a.c}">${a.ic}</div><div class="t"><div class="n">${a.n}</div><div class="s" id="s_${a.k}">${a.status}</div></div><div class="st"><b id="v_${a.k}">${a.stat}</b><small id="l_${a.k}">${a.sl}</small></div></div>`).join('')}
 else if(tab==='tk'){p.innerHTML=`<div class="tr" style="color:#64748b;font-size:11px"><div class="sy">TOKEN</div><span>IN</span><span>OUT</span><span>PNL</span></div>`+st.trades.slice().reverse().slice(0,7).map(t=>`<div class="tr"><div class="sy">$${t.sym}</div><span>${t.in.toFixed(3)}</span><span>${t.out.toFixed(3)}</span><span style="color:${t.closed?(t.out-t.in>=0?'#16a34a':'#dc2626'):'#64748b'}">${t.closed?((t.out/t.in-1)*100).toFixed(1)+'%':'open'}</span></div>`).join('')}
 else{const b=shownBal??0;p.innerHTML=[['Start bankroll',`${(D?.start_sol||0).toFixed(3)} SOL`],['Wallet now',`${b.toFixed(4)} SOL`],['Realized PnL',`${fmt(st.realized)} SOL`],['Trades',`${st.buys} (${st.w}W · ${st.l}L)`],['Best trade',D?.best?`$${D.best.symbol} +${D.best.pct}%`:'—'],['Candidates blocked',`${st.bundle+st.safety}`]].map(([a,b])=>`<div class="tr"><div class="sy" style="color:#64748b">${a}</div><span style="width:auto">${b}</span></div>`).join('')}}
function setAgent(k,status,stat,sl){const a=A[k];if(status!=null&&status!==a.status){a.status=status;const e=$('s_'+k);if(e){e.textContent=status;e.classList.remove('fl');void e.offsetWidth;e.classList.add('fl')}}
 if(stat!=null){a.stat=stat;const e=$('v_'+k);if(e)e.textContent=stat}if(sl!=null){a.sl=sl;const e=$('l_'+k);if(e)e.textContent=sl}}
// ---------- notification
let ntTimer=null;
function notify(msg,val,col,when){const n=$('nt');const show=()=>{$('ntm').innerHTML=msg;$('ntv').textContent=val||'';$('ntv').style.color=col;$('nta').textContent=when||'NOW';n.classList.add('show');clearTimeout(ntTimer);ntTimer=setTimeout(()=>n.classList.remove('show'),LIVE?4200:Math.max(900,GAP*0.85))};
 if(n.classList.contains('show')){n.classList.remove('show');setTimeout(show,230)}else show()}
// ---------- event player
let GAP=900;
function play(e){const n=e.type;const when=LIVE?'NOW':wib(e.ts)+' WIB';
 if(!LIVE)$('clk').textContent=wib(e.ts);
 st.evaluated.add(e.symbol);
 setAgent('scan',`Found $${e.symbol}`,String(st.evaluated.size),'evaluated');
 const nd=node(e.symbol,n==='skip'?'skip':(nodes[e.symbol]?.kind==='skip'?'trade':(nodes[e.symbol]?.kind||'trade')));
 const T=Math.min(GAP*0.7,900);
 if(n==='skip'){nd.badge='';go('scan',nd.x-18,nd.y+16,T*0.55);const ag=e.agent==='bundle'?'bundle':'safety';go(ag,nd.x+16,nd.y+18,T*0.8,T*0.15);
  setTimeout(()=>{nd.badge='SKIP';nd.bc='#ef4444';nd.reason=e.reason;floatPill(nd.x,nd.y-26,'✕ '+e.reason,'#dc2626','#fee2e2');
   st[ag]++;setAgent(ag,`Blocked $${e.symbol} · ${e.reason}`,String(st[ag]),'blocked');
   notify(`Skipped <b>$${e.symbol}</b> <span style="color:#dc2626;font-weight:600">· ${e.reason}</span>`,'',null,when)},T);
 }else if(n==='buy'){nd.kind='trade';nd.badge='';go('scan',nd.x-20,nd.y+14,T*0.45);go('bundle',nd.x+20,nd.y+16,T*0.6,T*0.1);go('safety',nd.x-4,nd.y+24,T*0.65,T*0.15);go('buy',nd.x+2,nd.y-2,T*0.9,T*0.2);
  setTimeout(()=>{setAgent('bundle',`$${e.symbol} passed`,null);setAgent('safety',`$${e.symbol} passed RugCheck`,null)},T*0.7);
  setTimeout(()=>{nd.badge='HOLD';nd.bc='#0ea5e9';nd.cost=e.sol;nd.got=0;floatPill(nd.x,nd.y-26,`−${e.sol.toFixed(3)} SOL`,'#0f172a','#fff');
   st.buys++;st.spent+=e.sol;st.trades.push({sym:e.symbol,in:e.sol,out:0,closed:false});
   setAgent('buy',`Bought $${e.symbol} · ${e.sol.toFixed(3)} SOL`+(e.mc?` @ MC $${(e.mc/1000).toFixed(1)}k`:''),String(st.buys),`${st.spent.toFixed(2)} SOL in`);
   if(e.balance!=null)setBal(e.balance);
   notify(`Bought <b>$${e.symbol}</b>`,`${e.sol.toFixed(3)} SOL`,'#0f172a',when);if(tab!=='ag')buildPanel()},T);
 }else if(n==='sell'){nd.kind='trade';go('sell',nd.x+4,nd.y+4,T*0.9);
  setTimeout(()=>{const tr=st.trades.slice().reverse().find(t=>t.sym===e.symbol);if(tr){tr.out+=e.sol;if(e.full)tr.closed=true}
   const pnl=e.full?(tr?tr.out-tr.in:e.pnl):null;
   if(e.full){st.realized+=pnl;pnl>0?st.w++:st.l++;const pct=tr?(tr.out/tr.in-1)*100:e.pct;nd.badge=`${pct>=0?'+':'−'}${Math.abs(pct).toFixed(0)}%`;nd.bc=pct>=0?'#16a34a':'#ef4444';nd.closed=true}
   else{nd.badge='TP ½';nd.bc='#16a34a'}
   floatPill(nd.x,nd.y-26,`+${e.sol.toFixed(3)} SOL`,'#15803d','#dcfce7');
   const why=(e.reason||'').replace(/^watcher: /,'').replace(/^manual[^:]*: /,'manual: ');
   setAgent('sell',`${e.full?'Sold':'Sold ½'} $${e.symbol} · ${why}`,`${st.w}W·${st.l}L`,'closed');
   if(e.balance!=null)setBal(e.balance);
   if(e.full)notify(`Sold <b>$${e.symbol}</b>`,`${pnl>=0?'+':'−'}${Math.abs(pnl).toFixed(3)} SOL`,pnl>=0?'#16a34a':'#dc2626',when);
   else notify(`Take profit <b>$${e.symbol}</b> · sold half`,`+${e.sol.toFixed(3)} SOL`,'#16a34a',when);
   if(tab!=='ag')buildPanel()},T)}
 setTimeout(()=>{for(const k of['scan','bundle','safety','buy','sell']){}},T)}
let lastPlay=0;
function pump(now){if(queue.length&&now-lastPlay>=GAP){const e=queue.shift();GAP=LIVE?1600:(e.type==='skip'?REPLAY_SKIP:REPLAY_TRADE);if(LIVE&&queue.length>4)GAP=500;play(e);lastPlay=now;
  if(!queue.length&&!LIVE)setTimeout(goLive,GAP+400)}}
let REPLAY_SKIP=420,REPLAY_TRADE=1150;
function goLive(){LIVE=true;$('mode').className='';$('modet').textContent='LIVE';$('clk').textContent=nowWib();if(D){setBal(D.balance_sol);syncLive()}
 for(const k in A){go(k,A[k].home[0],A[k].home[1],1200,Math.random()*300)}}
function syncLive(){if(!D)return;const f=D.feed||{};
 if(f.creates_total!=null)setAgent('scan',`PumpPortal feed · ${f.creates_total} new tokens · ${f.alive} tracked`,String(st.evaluated.size),'evaluated');
 const op=D.open||[];
 if(op.length)setAgent('sell',`Holding ${op.map(o=>'$'+o.symbol+(o.pct!=null?` ${o.pct>=0?'+':''}${o.pct.toFixed(0)}%`:'')).join(', ')}`,null);
 else setAgent('sell','No open positions · armed for TP / cut-loss',null);
 setAgent('buy',st.buys?A.buy.status:'Waiting for a clean candidate',null);
 const wl=D.watcher_last?((Date.now()-new Date(D.watcher_last))/1000):1e9;$('wtxt').textContent=wl<120?'Watcher on':'Watcher idle';
 $('wdot').querySelector('i').style.background=wl<120?'#22c55e':'#f59e0b';
 for(const o of op){const n=nodes[o.symbol];if(n&&o.pct!=null){n.badge=`${o.pct>=0?'+':'−'}${Math.abs(o.pct).toFixed(0)}%`;n.bc=o.pct>=0?'#16a34a':'#ef4444'}}
 if(queue.length===0&&D.balance_sol!=null)setBal(D.balance_sol)}
async function poll(first){try{const r=await fetch('data.json?_='+Date.now(),{cache:'no-store'});const d=await r.json();D=d;
  const fresh=d.events.filter(e=>!seen.has(e.id));fresh.forEach(e=>seen.add(e.id));
  if(first){setBal(d.start_sol||1);const total=fresh.length;const sk=fresh.filter(e=>e.type==='skip').length,tr=total-sk;
    const target=(+Q.get('replay')||30)*1000;const k=target/(sk*420+tr*1150||1);REPLAY_SKIP=Math.max(220,420*k);REPLAY_TRADE=Math.max(600,1150*k);
    if(Q.get('replay')==='0'){fresh.forEach(e=>{});}
    queue.push(...fresh);if(!fresh.length)goLive()}
  else{queue.push(...fresh);if(LIVE)syncLive()}
  renderCard()}catch(err){console.warn(err)}}
// ---------- drawing
function drawBg(){const c=document.createElement('canvas');const k=cv.width/MW;c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.scale(k,k);
 g.fillStyle='#eef5ee';g.fillRect(0,0,MW,MH);const r=rng(7);
 for(let i=0;i<9;i++){g.fillStyle=i%3?'#e3efe4':'#f4f8f1';const x=r()*MW,y=r()*MH,w=60+r()*110,h=40+r()*70;g.beginPath();g.roundRect(x,y,w,h,18);g.fill()}
 g.lineCap='round';
 const roads=[];const hs=[70,175,280],vs=[105,255,400];hs.forEach(b=>{const pts=[];for(let j=0;j<=4;j++)pts.push([j/4*MW,b+(r()-.5)*44]);roads.push(pts)});vs.forEach(b=>{const pts=[];for(let j=0;j<=4;j++)pts.push([b+(r()-.5)*50,j/4*MH]);roads.push(pts)});{const pts=[];for(let j=0;j<=4;j++)pts.push([j/4*MW,MH*0.95-j/4*MH*0.9+(r()-.5)*30]);roads.push(pts)}
 for(const [w,col] of [[11,'#dfe8df'],[8,'#ffffff']])for(const p of roads){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...p[0]);for(let j=1;j<p.length-1;j++){const m=[(p[j][0]+p[j+1][0])/2,(p[j][1]+p[j+1][1])/2];g.quadraticCurveTo(p[j][0],p[j][1],m[0],m[1])}g.lineTo(...p[p.length-1]);g.stroke()}
 g.strokeStyle='rgba(100,140,110,.08)';g.lineWidth=1;for(let x=0;x<MW;x+=28){g.beginPath();g.moveTo(x,0);g.lineTo(x,MH);g.stroke()}for(let y=0;y<MH;y+=28){g.beginPath();g.moveTo(0,y);g.lineTo(MW,y);g.stroke()}
 bgCache=c}
function rr(x,y,w,h,r,fill,stroke){cx.beginPath();cx.roundRect(x,y,w,h,r);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke()}}
function frame(now){pump(now);freeSkips();
 // balance tween
 if(targetBal!=null&&shownBal!==targetBal){const t=Math.min(1,(now-balT0)/700);shownBal=balFrom+(targetBal-balFrom)*ease(t);if(t>=1)shownBal=targetBal;renderCard()}
 if(!bgCache)drawBg();cx.drawImage(bgCache,0,0,MW,MH);
 // agents update
 for(const k in A){const a=A[k];if(a.to&&now>=a.t0){let t=Math.max(0,Math.min(1,(now-a.t0)/a.dur));const e=ease(t);const u=1-e;a.x=u*u*a.from[0]+2*u*e*a.cp[0]+e*e*a.to[0];a.y=u*u*a.from[1]+2*u*e*a.cp[1]+e*e*a.to[1];if(t>=1){a.to=null}}
  a.trail.push([a.x,a.y,now]);while(a.trail.length&&now-a.trail[0][2]>2600)a.trail.shift()}
 // trails
 for(const k in A){const a=A[k],tr=a.trail;if(tr.length<2)continue;cx.lineCap='round';cx.lineJoin='round';
  for(let i=1;i<tr.length;i++){const al=1-(now-tr[i][2])/2600;if(al<=0)continue;cx.strokeStyle=a.c;cx.globalAlpha=al*0.75;cx.lineWidth=3.2;cx.beginPath();cx.moveTo(tr[i-1][0],tr[i-1][1]);cx.lineTo(tr[i][0],tr[i][1]);cx.stroke()}cx.globalAlpha=1}
 // nodes
 const ns=Object.values(nodes).sort((a,b)=>(a.kind==='skip')-(b.kind==='skip'));
 for(const n of ns){const age=(now-n.born)/1000;const sc=Math.max(0,Math.min(1,age/0.35));const pop=sc<1?ease(sc)*1.12:1;
  let alpha=1,rad=n.kind==='skip'?15:21;if(n.kind==='skip'&&n.badge==='SKIP'){const f=(now-n.t)/1000;alpha=Math.max(.35,1-Math.max(0,f-1.6)/2.5)}
  if(n.closed)alpha=.92;
  cx.globalAlpha=alpha;const R=Math.max(0.5,rad*pop);
  cx.shadowColor='rgba(15,23,42,.16)';cx.shadowBlur=10;cx.shadowOffsetY=3;
  cx.beginPath();cx.arc(n.x,n.y,R,0,7);cx.fillStyle='#fff';cx.fill();cx.shadowColor='transparent';
  const ring=n.kind==='skip'?(n.badge?'#fca5a5':'#cbd5e1'):(n.badge==='HOLD'?'#7dd3fc':(n.bc||'#86efac'));
  cx.lineWidth=n.kind==='skip'?2:3;cx.strokeStyle=ring;cx.stroke();
  // glyph: coin
  cx.fillStyle=n.kind==='skip'?'#94a3b8':'#0f172a';cx.font=`800 ${n.kind==='skip'?9.5:11}px Inter`;cx.textAlign='center';cx.textBaseline='middle';
  const lab='$'+(n.sym.length>8?n.sym.slice(0,7)+'…':n.sym);
  cx.fillText(n.kind==='skip'?n.sym.slice(0,3).toUpperCase():n.sym.slice(0,4).toUpperCase(),n.x,n.y+0.5);
  // label below
  cx.font='700 10.5px Inter';const tw=cx.measureText(lab).width+12;rr(n.x-tw/2,n.y+R+3,tw,17,8.5,'rgba(255,255,255,.92)');cx.fillStyle='#0f172a';cx.fillText(lab,n.x,n.y+R+12);
  if(n.badge){cx.font='800 9.5px Inter';const bw=cx.measureText(n.badge).width+10;rr(n.x+R-12,n.y-R-8,bw,16,8,n.bc);cx.fillStyle='#fff';cx.fillText(n.badge,n.x+R-12+bw/2,n.y-R);}
  cx.globalAlpha=1}
 // agents
 for(const k in A){const a=A[k];const bob=a.to?0:Math.sin(now/600+a.ph)*1.6;cx.shadowColor='rgba(15,23,42,.25)';cx.shadowBlur=8;cx.shadowOffsetY=2;
  cx.beginPath();cx.arc(a.x,a.y+bob,12,0,7);cx.fillStyle='#fff';cx.fill();cx.shadowColor='transparent';cx.beginPath();cx.arc(a.x,a.y+bob,9.5,0,7);cx.fillStyle=a.c;cx.fill();
  cx.fillStyle='#fff';cx.font='800 10px Inter';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(a.ic,a.x,a.y+bob+.5)}
 // floats
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];const t=(now-f.t)/1800;if(t>=1){floats.splice(i,1);continue}
  const y=f.y-ease(Math.min(1,t*1.4))*22;const al=t<.75?1:1-(t-.75)/.25;const s=t<.12?ease(t/.12):1;cx.globalAlpha=al;cx.font='800 11.5px Inter';
  const w=cx.measureText(f.txt).width+16;let x=Math.max(w/2+4,Math.min(MW-w/2-4,f.x));cx.save();cx.translate(x,y);cx.scale(s,s);cx.shadowColor='rgba(15,23,42,.15)';cx.shadowBlur=8;rr(-w/2,-11,w,22,11,f.bg);cx.shadowColor='transparent';cx.fillStyle=f.col;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(f.txt,0,.5);cx.restore();cx.globalAlpha=1}
 if(LIVE&&now%1000<20)$('clk').textContent=nowWib();
 requestAnimationFrame(frame)}
document.fonts.ready.then(()=>{sizeCanvas();buildPanel();AG.forEach(a=>setAgent(a.k,'Starting replay…','0',''));setAgent('scan',null,'0','evaluated');renderCard();poll(true);setInterval(()=>poll(false),5000);setInterval(()=>{if(LIVE)$('clk').textContent=nowWib()},1000);requestAnimationFrame(frame)});
